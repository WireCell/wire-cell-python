# xvunet stage 1 WITH the cross-plane correspondence term (wcpy-hbj).
#
# Frozen trunks, warm-started from the three per-view UNet checkpoints, so the
# attention branch is the only trainable path and all correspondence gradient
# lands on it.  Unfrozen, the trunks absorb some of it and cannot use it, since
# they never see another view.
#
# THE CONTROL RUN for this is the same file with trio_strength=0 (see
# jcal-uniter-trio-stage1-band0-control.cfg).  That is the comparison wcpy-hbj's
# acceptance criterion asks for, and it is the only way to tell emphasis from
# noise: the trios are a function of the truth, so BCE could in principle learn
# all of it already.
#
# Data is rebin_fix_input_trios, regenerated so the frames, the truth and the
# trios all come from one job on APA 0 with one tick grid.  The file-ID group
# comes from the DIRECTORY, because every directory holds a depo file of the
# same name.

[train]
app=xvunet
device=cpu
files=/home/dune/users/jcalcutt/spng_cm_sep26_retraining_rebin_fix_trios/*_0/*cosmics_*-g4-*.h5
batch=1
epochs=1

[model]
view_splits=[[800],[800],[480,480]]
chunks=[8,8,8]
d_model=96
n_heads=4
n_layers=2
band=0
attn_mode=legacy
unet_checkpoints=['/gpfs01/lbne/users/spng/jcalcutt/training_results/0_2267_dense_dnnroi_uplane_spng_retraining_sep26_cm/training_results_0_2267.pt', '/gpfs01/lbne/users/spng/jcalcutt/training_results/0_2268_dense_dnnroi_vplane_spng_retraining_sep26_cm/training_results_0_2268.pt', '/gpfs01/lbne/users/spng/jcalcutt/training_results/0_2269_dense_dnnroi_wplane_spng_retraining_sep26_cm/training_results_0_2269.pt']
freeze_unets=true

[optimizer]
name=adamw
learning_rate=0.001

[criterion]
# MEASURED with these trunks on this data, batch 1, 6 samples: base BCE median
# 0.00772, unweighted trio term median 0.09297, so the raw term runs about 11.5x
# the base.  That is not what an earlier estimate from truth-derived logits
# suggested (it put the ratio near 1) -- the real model has easy background,
# which makes base BCE small, and its trio misses have confident partners, which
# makes the term large.  0.08 puts the term at roughly the same size as the base
# BCE at the start of stage 1.
#
# This is a STARTING POINT, not a tuned value.  Raise it to emphasise
# correspondence harder, lower it if the base ROI metrics regress.
trio_strength=0.06

[dataset]
##DO NOT PUT ANY QUOTES AROUND THE file_re VALUES
## NOTE the escaping differs by shape: rec_file_res/tru_file_res are LIST
## literals and go through ast.literal_eval, which eats one backslash, so
## they need \\d.  trio_file_re is a BARE string used verbatim, so it needs
## \d.  Writing \\d there matches nothing and the dataset reports 0 samples.
rec_file_res=['.*/([0-9]|[1-9][0-9]|[1-9][0-9][0-9])_0/cosmics.*-g4-rec-0\.h5', '.*/([0-9]|[1-9][0-9]|[1-9][0-9][0-9])_0/cosmics.*-g4-rec-1\.h5', '.*/([0-9]|[1-9][0-9]|[1-9][0-9][0-9])_0/cosmics.*-g4-rec-2\.h5']
tru_file_res=['.*/([0-9]|[1-9][0-9]|[1-9][0-9][0-9])_0/cosmics.*-g4-tru-0\.h5', '.*/([0-9]|[1-9][0-9]|[1-9][0-9][0-9])_0/cosmics.*-g4-tru-1\.h5', '.*/([0-9]|[1-9][0-9]|[1-9][0-9][0-9])_0/cosmics.*-g4-tru-2\.h5']
trio_file_re=.*/([0-9]|[1-9][0-9]|[1-9][0-9][0-9])_0/cosmics.*-g4-trio\.h5
rec_path_res=['/(\\d+)/frame_loose_lf\\d']
tru_path_res=['/(\\d+)/frame_ductor\\d']
elech_binnings=[[0,800,1],[0,800,1],[0,960,1]]
tick_binning=[0,1500,1]
tru_norm=0.05
rec_norm=1
# Keep only trios whose three pixels are all above threshold in tru.  Without
# this only ~33% of trios are complete in the target, and the weight would be
# driven by target incompleteness as much as by cross-view failure.  Default is
# already true; stated here because it is load-bearing.
trio_require_tru=true

[run_one_dataset]
