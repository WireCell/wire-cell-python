#Note -- this is to be used on files created via mp2/mp3, but only taking in loose_lf info

[train]
app=dnnroi_custom
device=cpu
files=/home/dune/users/jcalcutt/test_files/*_0/*cosmics_*-g4-*-1.h5
batch=1
epochs=1

[model]
n_channels=3

[optimizer]
learning_rate=0.005
[dataset]
##DO NOT PUT ANY QUOTES AROUND THESE
tru_file_re=.*/([0-9]|[1-4][0-9])_0/cosmics.*-g4-tru-1.h5
rec_file_re=.*/([0-9]|[1-4][0-9])_0/cosmics.*-g4-rec-1.h5

tru_path_res=['/(\\d+)/frame_ductor\\d']
rec_path_res=['/(\\d+)/frame_loose_lf\\d', '/(\\d+)/frame_mp2_roi\\d', '/(\d+)/frame_mp3_roi\\d']
tru_elech_binning=[0, 800, 1]
rec_elech_binning=[0, 800, 1]
tru_tick_binning=[0, 1500, 1]
rec_tick_binning=[0, 1500, 1]
tru_norm=0.05
rec_norm=1

[run_one_dataset]
tru_path_res=['/(\\d+)/frame_ductor\\d']
rec_path_res=['/(\\d+)/frame_loose_lf\\d', '/(\\d+)/frame_mp2_roi\\d', '/(\d+)/frame_mp3_roi\\d']
tru_elech_binning=[0, 800, 1]
rec_elech_binning=[0, 800, 1]
tru_tick_binning=[0, 1500, 1]
rec_tick_binning=[0, 1500, 1]
tru_norm=0.05
rec_norm=1
