# Trio-consistency check (wcpy-hbj): local copy of
# jcal-uniter-spng-dense_input-mpfile-pdhd-legacy-attn-chunk8-band0.cfg with the
# file locations pointed at this machine.
#
# The inputs sit directly in rebin_fix_input/ rather than in <N>_0/ subdirs, so
# the file regexes capture the event id from the FILENAME (cosmics_<id>-g4-...).
# Group 1 is the file ID that pairs a rec file with its tru file.
#
# unet_checkpoints are left pointing at /gpfs on purpose: they do not exist here,
# and resolving the model config against the loaded checkpoint drops them (they
# only seed a fresh model).  If that ever regresses this config fails loudly.

[train]
app=xvunet
device=cpu
files=/nfs/data/1/calcuttj/wcpy_speedtest/rebin_fix_input/*cosmics_*-g4-*-*.h5
batch=1
epochs=1

[model]
view_splits=[[800],[800],[480,480]]
chunks=[8,8,8]
d_model=96
n_heads=4
n_layers=2
band=0
unet_checkpoints=['/gpfs01/lbne/users/spng/jcalcutt/training_results/0_2267_dense_dnnroi_uplane_spng_retraining_sep26_cm/training_results_0_2267.pt', '/gpfs01/lbne/users/spng/jcalcutt/training_results/0_2268_dense_dnnroi_vplane_spng_retraining_sep26_cm/training_results_0_2268.pt', '/gpfs01/lbne/users/spng/jcalcutt/training_results/0_2269_dense_dnnroi_wplane_spng_retraining_sep26_cm/training_results_0_2269.pt']
freeze_unets=true
attn_mode=legacy

[optimizer]
name=adamw
learning_rate=0.001

[dataset]
##DO NOT PUT ANY QUOTES AROUND THE file_re VALUES
rec_file_res=['.*/cosmics_(\\d+_\\d+)-g4-rec-0\.h5', '.*/cosmics_(\\d+_\\d+)-g4-rec-1\.h5', '.*/cosmics_(\\d+_\\d+)-g4-rec-2\.h5']
tru_file_res=['.*/cosmics_(\\d+_\\d+)-g4-tru-0\.h5', '.*/cosmics_(\\d+_\\d+)-g4-tru-1\.h5', '.*/cosmics_(\\d+_\\d+)-g4-tru-2\.h5']
rec_path_res=['/(\\d+)/frame_loose_lf\\d']
tru_path_res=['/(\\d+)/frame_ductor\\d']
elech_binnings=[[0,800,1],[0,800,1],[0,960,1]]
tick_binning=[0,1500,1]
tru_norm=0.05
rec_norm=1
