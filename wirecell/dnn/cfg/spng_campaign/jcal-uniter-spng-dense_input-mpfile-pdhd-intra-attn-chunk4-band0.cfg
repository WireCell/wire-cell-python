# xvunet: 3 per-view UNet trunks + time-banded cross-view attention,
# trained on deconvolved (loose_lf) images only -- no MP2/MP3 inputs.
#
# Staged training:
#  0) pretrain per-plane trunks (see xv_pretrain_{u,v,w}.cfg) -> pre_{u,v,w}.pt
#  1) frozen trunks: uncomment unet_checkpoints + freeze_unets below, then
#     uv run wcpy dnn train --cache -e 20 -b 1 -d gpu -a xvunet -c xv_train.cfg -s xv_stage1.pt
#  2) unfreeze: comment freeze_unets, set init_checkpoint=xv_stage1.pt,
#     divide learning_rate by 10, train again.
#     (Do NOT use --load across stages: optimizer param groups differ.)

[train]
app=xvunet
device=cpu
files=/home/dune/users/jcalcutt/spng_cm_sep26_retraining_rebin_fix_trios/*_0/*cosmics_*-g4-*-*.h5
batch=1
epochs=1

[model]
view_splits=[[800],[800],[480,480]]
chunks=[4,4,4]
d_model=96
n_heads=4
n_layers=2
band=0
unet_checkpoints=['/gpfs01/lbne/users/spng/jcalcutt/training_results/0_2267_dense_dnnroi_uplane_spng_retraining_sep26_cm/training_results_0_2267.pt', '/gpfs01/lbne/users/spng/jcalcutt/training_results/0_2268_dense_dnnroi_vplane_spng_retraining_sep26_cm/training_results_0_2268.pt', '/gpfs01/lbne/users/spng/jcalcutt/training_results/0_2269_dense_dnnroi_wplane_spng_retraining_sep26_cm/training_results_0_2269.pt']
freeze_unets=true
attn_mode=intra

[optimizer]
name=adamw
learning_rate=0.001

[dataset]
##DO NOT PUT ANY QUOTES AROUND THE file_re VALUES
rec_file_res=['.*/([0-9]|[1-9][0-9]|[1-9][0-9][0-9]|1[0-9][0-9][0-9])_0/cosmics.*-g4-rec-0\.h5', '.*/([0-9]|[1-9][0-9]|[1-9][0-9][0-9]|1[0-9][0-9][0-9])_0/cosmics.*-g4-rec-1\.h5', '.*/([0-9]|[1-9][0-9]|[1-9][0-9][0-9]|1[0-9][0-9][0-9])_0/cosmics.*-g4-rec-2\.h5']
tru_file_res=['.*/([0-9]|[1-9][0-9]|[1-9][0-9][0-9]|1[0-9][0-9][0-9])_0/cosmics.*-g4-tru-0\.h5', '.*/([0-9]|[1-9][0-9]|[1-9][0-9][0-9]|1[0-9][0-9][0-9])_0/cosmics.*-g4-tru-1\.h5', '.*/([0-9]|[1-9][0-9]|[1-9][0-9][0-9]|1[0-9][0-9][0-9])_0/cosmics.*-g4-tru-2\.h5']
#rec_file_res=['.*/(0)_0/cosmics.*-g4-rec-0\.h5', '.*/(0)_0/cosmics.*-g4-rec-1\.h5', '.*/(0)_0/cosmics.*-g4-rec-2\.h5']
#tru_file_res=['.*/(0)_0/cosmics.*-g4-tru-0\.h5', '.*/(0)_0/cosmics.*-g4-tru-1\.h5', '.*/(0)_0/cosmics.*-g4-tru-2\.h5']
rec_path_res=['/(\\d+)/frame_loose_lf\\d']
tru_path_res=['/(\\d+)/frame_ductor\\d']
elech_binnings=[[0,800,1],[0,800,1],[0,960,1]]
